# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
#
# Generic root Taskfile. This is the canonical copy served to every repo that
# adopts methridge/taskfiles; it is identical across all consumers. Repos vendor
# the shared task files into .taskfiles/shared/ and keep their own tasks in
# .taskfiles/project/project.yml. Refresh with `task sync`; bootstrap a new repo
# with the init.sh one-liner (see README.md).

version: "3"

includes:
  git:
    taskfile: .taskfiles/shared/git.yml
    flatten: true
  go:
    taskfile: .taskfiles/shared/go.yml
    flatten: true
    optional: true
  ansible:
    taskfile: .taskfiles/shared/ansible.yml
    flatten: true
    optional: true
  project:
    taskfile: .taskfiles/project/project.yml
    flatten: true
    optional: true

tasks:
  default:
    desc: Show available tasks
    aliases: [help]
    cmds:
      - task --list-all

  sync:
    desc: Re-vendor the generic root + shared taskfiles from methridge/taskfiles
    # TASKFILES_REF default = the release this file shipped with, so a bare
    # `task sync` re-pulls the same version (idempotent, no surprise upgrades).
    # It is stamped at release time (see the `release:*` task). Upgrade explicitly
    # with TASKFILES_REF on the CLI or, durably, `export TASKFILES_REF` in .envrc.
    vars:
      TASKFILES_REF: '{{.TASKFILES_REF | default "v1.2.0"}}'
      TASKFILES_FILES: '{{.TASKFILES_FILES | default "git.yml scripts/lib.sh scripts/merge.sh scripts/review.sh"}}'
      # Claude Code plugin profile for this repo (claude/<name>.json upstream).
      # Empty = leave .claude/settings.json alone, so a bare `task sync` in a
      # fresh clone never wipes the committed file. Set durably in .envrc.
      TASKFILES_CLAUDE_PROFILE: '{{.TASKFILES_CLAUDE_PROFILE | default ""}}'
      TASKFILES_BASE: '{{.TASKFILES_BASE | default (print "https://raw.githubusercontent.com/methridge/taskfiles/" .TASKFILES_REF)}}'
    cmds:
      # Generic root — safe to overwrite; project tasks live in .taskfiles/project/.
      - curl -fsSL "{{.TASKFILES_BASE}}/Taskfile.yaml" -o Taskfile.yaml
      - for: { var: TASKFILES_FILES, split: " " }
        cmd: |
          mkdir -p ".taskfiles/shared/$(dirname "{{.ITEM}}")"
          curl -fsSL "{{.TASKFILES_BASE}}/.taskfiles/shared/{{.ITEM}}" -o ".taskfiles/shared/{{.ITEM}}"
          case "{{.ITEM}}" in *.sh) chmod +x ".taskfiles/shared/{{.ITEM}}" ;; esac
      - |
        if [ -n "{{.TASKFILES_CLAUDE_PROFILE}}" ]; then
          mkdir -p .claude
          tmp="$(mktemp)"
          if curl -fsSL "{{.TASKFILES_BASE}}/claude/{{.TASKFILES_CLAUDE_PROFILE}}.json" -o "$tmp"; then
            mv "$tmp" .claude/settings.json
            echo "Synced .claude/settings.json (TASKFILES_CLAUDE_PROFILE={{.TASKFILES_CLAUDE_PROFILE}})."
          else
            rm -f "$tmp"
            echo "Failed to fetch claude profile '{{.TASKFILES_CLAUDE_PROFILE}}'; .claude/settings.json left untouched." >&2
            exit 1
          fi
        fi

  sync:check:
    desc: Report whether a newer methridge/taskfiles release is available
    vars:
      # Currently-vendored version = the sync default stamped into this file.
      CURRENT:
        sh: |
          sed -nE 's/.*default "(v[0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' Taskfile.yaml | head -1
      # Newest release tag (same resolution as init.sh; no gh/jq needed).
      LATEST:
        sh: |
          git ls-remote --tags --refs --sort=-v:refname \
            https://github.com/methridge/taskfiles.git 'v*' 2>/dev/null \
            | sed -n '1s#.*/##p' || true
    cmds:
      - |
        if [ -z "{{.LATEST}}" ]; then
          echo "Could not reach methridge/taskfiles to check for releases." >&2
          exit 1
        fi
        if [ "{{.CURRENT}}" = "{{.LATEST}}" ]; then
          echo "Up to date: {{.CURRENT}} is the latest release."
        else
          echo "Update available: {{.CURRENT}} -> {{.LATEST}}"
          echo "  upgrade:  task sync TASKFILES_REF={{.LATEST}}"
          echo "  or pin:   export TASKFILES_REF={{.LATEST}}   (in .envrc)"
        fi
